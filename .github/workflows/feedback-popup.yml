name: Draft popup feedback tests

on:
  pull_request:
    paths:
      - "popup.html"
      - "popup.js"
      - "tests/**"
      - ".github/workflows/feedback-popup.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/popup.test.mjs
